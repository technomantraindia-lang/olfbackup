<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | OLF Stores</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b0e14;color:#e8edf4;font:14px Verdana,sans-serif;display:grid;place-items:center;padding:24px}.login{max-width:440px;width:100%}.brand{font-weight:700;font-size:24px;color:#ff8b2c;margin-bottom:35px}.eyebrow{font-size:10px;color:#ff963e;letter-spacing:.15em}h1{font-size:28px;letter-spacing:-1px;margin:12px 0}p{font-size:12px;color:#a4afbf;line-height:1.9}.card{padding:30px;background:#141922;border:1px solid #2c3442;border-radius:14px;margin-top:24px}label{display:block;font-size:12px;margin:0 0 20px}input{display:block;width:100%;padding:13px;margin-top:9px;border:1px solid #3c4656;border-radius:7px;background:#0e131c;color:#edf1f7;font:14px Verdana}input:focus{outline:1px solid #ff8b2c;border-color:#ff8b2c}button{font:12px Verdana;cursor:pointer;border:0;border-radius:7px}button[type=submit]{width:100%;padding:14px;background:#ff7a00;color:#1e1106;font-weight:700}button:disabled{opacity:.5;cursor:wait}.password{position:relative}.password input{padding-right:70px}.show{position:absolute;right:10px;top:11px;padding:4px;background:transparent;color:#acb9cc}#login-error{font-size:12px;line-height:1.8;background:#a43c3c25;border:1px solid #a43c3c70;padding:12px;border-radius:7px;margin-bottom:20px}#login-error:empty{display:none}.note{text-align:center;font-size:10px;margin-top:22px}</style><link rel="stylesheet" href="/assets/brand.css?v=20261022">
</head><body><main class="login"><div class="brand"><span class="olf-wordmark">OLF</span></div><div class="eyebrow">YOUR BUSINESS WORKSPACE</div><h1>Welcome back</h1><p>Sign in with your OLF account.<br>Your role decides what you can view and change.</p><form id="login-form" class="card"><div id="login-error" role="alert"></div><label>Email address<input id="login-email" type="email" autocomplete="username" value="admin@olfstores.com" required autofocus></label><label>Password<div class="password"><input id="login-password" type="password" autocomplete="current-password" value="admin123" required><button class="show" type="button" id="show-password" aria-pressed="false">Show</button></div></label><button type="submit" id="login-submit">Sign in</button></form><p class="note">Need access? Ask a system owner to add your account.</p></main><script>
const form=document.getElementById('login-form'),button=document.getElementById('login-submit');
function fillCredentials(){const e=document.getElementById('login-email'),p=document.getElementById('login-password');if(e&&!e.value)e.value='admin@olfstores.com';if(p&&!p.value)p.value='admin123';}
fillCredentials();window.addEventListener('DOMContentLoaded',fillCredentials);
document.getElementById('show-password').onclick=function(){const input=document.getElementById('login-password');const show=input.type==='password';input.type=show?'text':'password';this.textContent=show?'Hide':'Show';this.setAttribute('aria-pressed',String(show));};
form.onsubmit=async event=>{event.preventDefault();if(button.disabled)return;button.disabled=true;button.textContent='Signing in…';document.getElementById('login-error').textContent='';try{const response=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-OLF-Request':'1'},body:JSON.stringify({email:document.getElementById('login-email').value,password:document.getElementById('login-password').value})}),body=await response.json();if(!response.ok||body.status!==1)throw new Error(body.info||'Unable to sign in.');localStorage.removeItem('authToken');const next=new URLSearchParams(location.search).get('next');const target=next?new URL(next,location.origin):null;location.replace(target&&target.origin===location.origin&&target.pathname!=='/login'?target.href:'/');}catch(error){document.getElementById('login-error').textContent=error.message;button.disabled=false;button.textContent='Sign in';}};
</script></body></html>
